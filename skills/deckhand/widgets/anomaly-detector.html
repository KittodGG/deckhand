<!-- widgets/anomaly-detector.html — deck tokens only -->
<template id="anomaly-detector-template">
  <div class="anom" data-widget="anomaly-detector"><svg class="anom-svg" viewBox="0 0 400 160" role="img" aria-label="Time series"></svg><div class="anom-note"></div></div>
</template>
<style>
.anom{color:var(--ink);font-family:inherit}
.anom-svg{width:100%;height:160px}
.anom-line{fill:none;stroke:var(--accent);stroke-width:2}
.anom-dot{fill:var(--bad);stroke:var(--surface);stroke-width:2;cursor:pointer}
.anom-note{font-size:.82rem;color:var(--muted);margin-top:.5rem}
</style>
<script>
function initAnomalyDetector(container, data) {
  var svg = container.querySelector('.anom-svg'), note = container.querySelector('.anom-note');
  var NS = 'http://www.w3.org/2000/svg', series = data.series || [], anoms = data.anomalies || [];
  var max = Math.max.apply(null, series.map(function (p) { return p.value; }).concat([1]));
  var pts = series.map(function (p, i) {
    return ((i / Math.max(1, series.length - 1)) * 400) + ',' + (150 - (p.value / max) * 130);
  }).join(' ');
  var pl = document.createElementNS(NS, 'polyline');
  pl.setAttribute('points', pts); pl.setAttribute('class', 'anom-line'); svg.appendChild(pl);
  anoms.forEach(function (a) {
    var idx = series.findIndex(function (p) { return p.date === a.date; });
    if (idx < 0) return;
    var xy = pts.split(' ')[idx].split(',');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', xy[0]); c.setAttribute('cy', xy[1]); c.setAttribute('r', 6); c.setAttribute('class', 'anom-dot');
    c.addEventListener('click', function () { note.textContent = a.date + ': ' + a.value + ' — ' + (a.reason || 'anomali'); });
    svg.appendChild(c);
  });
  note.textContent = anoms.length + ' anomali terdeteksi. Klik titik untuk detail.';
}
</script>
