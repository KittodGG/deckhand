<!-- widgets/file-tree-churn.html — deck tokens only -->
<template id="file-tree-churn-template">
  <div class="file-tree" data-widget="file-tree-churn"><div class="tree-container"></div></div>
</template>
<style>
.file-tree{font-size:.85rem;color:var(--ink);font-family:inherit}
.tree-node{padding:.4rem .6rem;cursor:pointer;border-radius:8px;display:flex;gap:.5rem;align-items:center}
.tree-node:hover{background:var(--accent-soft)}
.tree-children{margin-left:1rem;border-left:1px solid var(--line);padding-left:.4rem}
.churn-dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.edit-count{margin-left:auto;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
</style>
<script>
function initFileTreeChurn(container, data) {
  var root = container.querySelector('.tree-container'); root.innerHTML = '';
  var max = data.maxEdits || 50;
  function color(edits) {
    var t = Math.min(edits / max, 1);
    return 'color-mix(in srgb, var(--counter) ' + Math.round(20 + t * 80) + '%, var(--surface))';
  }
  function render(box, nodes, depth) {
    (nodes || []).forEach(function (n) {
      var el = document.createElement('div');
      el.className = 'tree-node'; el.style.paddingLeft = (depth * 12 + 8) + 'px';
      if (n.type === 'folder') {
        el.innerHTML = '<span>▾ ' + n.name + '</span>';
        box.appendChild(el);
        var kids = document.createElement('div'); kids.className = 'tree-children';
        render(kids, n.children, depth + 1); box.appendChild(kids);
        el.addEventListener('click', function () { kids.style.display = kids.style.display === 'none' ? 'block' : 'none'; });
      } else {
        el.innerHTML = '<span class="churn-dot"></span><span>' + n.name + '</span><span class="edit-count">' + n.edits + ' edits</span>';
        el.querySelector('.churn-dot').style.background = color(n.edits);
        el.addEventListener('click', function () { el.dispatchEvent(new CustomEvent('widget:drill', { bubbles: true, detail: n })); });
        box.appendChild(el);
      }
    });
  }
  render(root, data.tree, 0);
}
</script>
